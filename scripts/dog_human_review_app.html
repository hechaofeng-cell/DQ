<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>犬类特征人工复核</title>
<style>:root{--ink:#202522;--muted:#657068;--line:#d8ded9;--paper:#f4f6f4;--white:#fff;--green:#17795b;--red:#b42318;--blue:#2563a6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit;letter-spacing:0}header{position:sticky;top:0;z-index:5;height:64px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}h1{font-size:18px;margin:0}header input{width:130px}.progress{flex:1;max-width:420px;height:8px;background:#e5e9e6}.fill{height:100%;background:var(--green)}button{cursor:pointer;border:1px solid var(--line);background:var(--white);padding:8px 12px}.primary{background:var(--green);color:white;border-color:var(--green)}main{display:grid;grid-template-columns:minmax(400px,1fr) minmax(500px,1fr);min-height:calc(100vh - 64px)}.left,.right{padding:18px}.left{border-right:1px solid var(--line)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tag{background:#e9eeea;padding:3px 7px}.images{display:grid;grid-template-columns:1fr 1fr;gap:10px}.images figure{margin:0;background:#222;min-width:0}.images figure:first-child{grid-column:1/-1}.images img{width:100%;height:260px;display:block;object-fit:contain}.images figure:first-child img{height:390px}.images figcaption{background:white;padding:5px;text-align:center;color:var(--muted)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.controls label{color:var(--muted)}input,select,textarea{width:100%;padding:8px;border:1px solid #b9c3bc;background:white}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:64px;background:#edf1ee;z-index:2}td:nth-child(1){width:150px}td:nth-child(2),td:nth-child(3){width:130px}.evidence{color:var(--muted);font-size:12px}.footer{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:8px}.footer textarea{flex:1;min-height:42px}.status{color:var(--muted)}.bad{color:var(--red)}@media(max-width:1000px){main{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.controls{grid-template-columns:1fr 1fr}.images figure:first-child img{height:300px}}@media(max-width:600px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:8px}main{display:block}.left,.right{padding:10px}.images{grid-template-columns:1fr}.images figure:first-child{grid-column:auto}.images img,.images figure:first-child img{height:260px}.controls{grid-template-columns:1fr}th{top:96px}}</style></head>
<body><header><h1>犬类特征人工复核</h1><input id="reviewer" placeholder="审核员ID"><input id="version" value="v1" placeholder="审核版本"><button id="load">载入</button><div class="progress"><div class="fill" id="fill"></div></div><span id="count">0/0</span><button id="prev" aria-label="上一张">←</button><button id="next" aria-label="下一张">→</button></header>
<main><section class="left"><h2 id="title"></h2><div class="meta" id="meta"></div><div class="images"><figure><img id="source"><figcaption>原图</figcaption></figure><figure><img id="marked"><figcaption>A框标记图</figcaption></figure><figure><img id="crop"><figcaption>放大裁剪图</figcaption></figure></div></section>
<section class="right"><div class="controls"><label>目标匹配<select id="target"><option value="">请选择</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">不确定</option></select></label><label>人工类别<select id="humanClass"><option value="">请选择</option><option value="dog">dog</option><option value="not_dog">非dog</option><option value="uncertain">不确定</option></select></label><label>SRL<select id="srl"><option value="">请选择</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option></select></label><label>人工可辨<select id="recognizable"><option value="">请选择</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">不确定</option></select></label></div><button id="accept">采纳全部模型特征</button><span class="status" id="featureStatus"></span><table><thead><tr><th>特征</th><th>模型值</th><th>人工值</th><th>模型证据</th></tr></thead><tbody id="features"></tbody></table><div class="footer"><textarea id="notes" placeholder="复核备注、不可辨原因或边界问题"></textarea><span class="status" id="status"></span><button class="primary" id="save">保存并下一张</button></div></section></main>
<script>const $=id=>document.getElementById(id);const S={data:null,index:0};const zh={coat_primary_color:'毛发主颜色',coat_pattern:'毛发图案',coat_length:'毛发长度',coat_texture:'毛发质地',white_marking_presence:'白色斑纹',head_visibility:'头部可见性',ear_shape:'耳朵形状',ear_position:'耳朵位置',muzzle_visibility:'口鼻可见性',eye_visibility:'眼睛可见性',tail_visibility:'尾巴可见性',tail_position:'尾巴位置',leg_visibility:'腿部可见性',body_shape:'身体形状',orientation:'朝向',pose:'姿势',action_state:'动作状态',occlusion_level:'遮挡程度',truncation_level:'边界截断',outline_visibility:'轮廓清晰度'};
function current(){return S.data.cases[S.index]}function option(v){return `<option value="${v}">${v}</option>`}function render(){const c=current(),f=c.feature||{features:{},evidence:{}};$('title').textContent=`${S.index+1}. ${c.image_id}`;$('meta').innerHTML=`<span class="tag">${c.split}</span><span class="tag">面积 ${(100*Number(c.target_area_ratio)).toFixed(2)}%</span><span class="tag ${c.classification_correct==='False'?'bad':''}">VLM: ${c.predicted_class}</span><span class="tag">${c.reasons.join(' · ')}</span>`;for(const k of ['source','marked','crop'])$(k).src=c.images[k];$('features').innerHTML=S.data.definitions.map(d=>`<tr><td>${zh[d.feature_id]||d.feature_id}<br><code>${d.feature_id}</code></td><td>${f.features[d.feature_id]??'无有效输出'}</td><td><select data-feature="${d.feature_id}"><option value="">请选择</option>${d.possible_values.map(option).join('')}</select></td><td class="evidence">${f.evidence[d.feature_id]??'-'}</td></tr>`).join('');const r=c.review||{};$('target').value=r.target_match||'';$('humanClass').value=r.human_class||'';$('srl').value=r.srl??'';$('recognizable').value=r.is_recognizable||'';$('notes').value=r.notes||'';document.querySelectorAll('[data-feature]').forEach(x=>x.value=(r.human_features||{})[x.dataset.feature]||'');$('featureStatus').textContent=c.feature_status==='ok'?'模型特征完整':'模型特征失败，请人工填写';$('count').textContent=`${S.data.completed}/${S.data.total}`;$('fill').style.width=`${100*S.data.completed/S.data.total}%`;$('status').textContent=''}
async function load(){const reviewer=$('reviewer').value.trim(),version=$('version').value.trim()||'v1';if(reviewer)localStorage.setItem('dogReviewer',reviewer);localStorage.setItem('dogReviewVersion',version);$('status').textContent='载入中';try{S.data=await fetch(`/api/data?reviewer=${encodeURIComponent(reviewer)}&version=${encodeURIComponent(version)}`).then(r=>{if(!r.ok)throw Error('接口加载失败');return r.json()});S.index=Math.max(0,S.data.cases.findIndex(c=>!c.review));render()}catch(e){$('status').textContent='载入失败：'+e.message}}function move(n){if(!S.data||!S.data.total)return;S.index=(S.index+n+S.data.total)%S.data.total;render()}$('accept').onclick=()=>{const f=current().feature?.features||{};document.querySelectorAll('[data-feature]').forEach(x=>{if(f[x.dataset.feature])x.value=f[x.dataset.feature]})};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('load').onclick=load;$('save').onclick=async()=>{if(!$('reviewer').value.trim()){$('status').textContent='保存前请填写审核员ID';return}const human_features={};document.querySelectorAll('[data-feature]').forEach(x=>human_features[x.dataset.feature]=x.value);const body={image_id:current().image_id,reviewer:$('reviewer').value.trim(),review_version:$('version').value.trim(),target_match:$('target').value,human_class:$('humanClass').value,srl:$('srl').value,is_recognizable:$('recognizable').value,human_features,notes:$('notes').value.trim()};$('save').disabled=true;try{const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json();if(!res.ok)throw Error(data.error);current().review=data.review;S.data.completed=S.data.cases.filter(c=>c.review).length;$('status').textContent='已保存';move(1)}catch(e){$('status').textContent='保存失败：'+e.message}finally{$('save').disabled=false}};$('reviewer').value=localStorage.getItem('dogReviewer')||'';$('version').value=localStorage.getItem('dogReviewVersion')||'v1';load();</script></body></html>
