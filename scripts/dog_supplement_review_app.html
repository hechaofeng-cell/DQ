<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTA 补图复核</title>
<style>
@font-face{font-family:ReviewChinese;src:url('/fonts/NotoSansSC-Regular.ttf') format('truetype');font-weight:400;font-display:swap}body{font-family:ReviewChinese,system-ui,sans-serif!important}
:root{--ink:#202522;--muted:#657068;--line:#d8ded9;--paper:#f5f7f6;--white:#fff;--green:#17795b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{padding:7px 11px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:4px}button:disabled{opacity:.45;cursor:default}input,select,textarea{padding:8px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);max-width:100%}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:white;border-bottom:1px solid var(--line);padding:12px 18px}h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}header input{width:150px}header a{color:var(--green);text-decoration:none}#progress{margin-left:auto;font-variant-numeric:tabular-nums}.shell{display:grid;grid-template-columns:205px minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:14px;background:white}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.filters button{font-size:12px}.filters button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}#queue{display:grid;gap:4px}#queue button{text-align:left;border-color:transparent;font-variant-numeric:tabular-nums}#queue button.active{border-color:var(--green);background:#eef8f3}.qstate{float:right;color:var(--muted)}main{min-width:0;padding:18px}.casehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.meta{color:var(--muted)}.casehead h2{margin:0}.nav{display:flex;gap:8px}.images{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;margin-bottom:18px}figure{margin:0;min-width:0;background:white;border:1px solid var(--line);border-radius:4px;overflow:hidden}figure button{display:block;width:100%;border:0;border-radius:0;padding:0;background:#e9edeb}figure img{width:100%;height:320px;object-fit:contain;display:block}figcaption{padding:7px 10px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}label{display:grid;gap:5px}label select{width:100%}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:600;background:#edf2ef}td:first-child{min-width:160px}td select{min-width:145px;width:100%}.evidence{color:var(--muted);max-width:650px;font-size:13px}.flag{border-left:3px solid var(--red);padding:8px 12px;margin-bottom:14px;background:white}.savebar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}.savebar textarea{width:100%;min-height:65px}.primary{background:var(--green);color:white;border-color:var(--green)}#status{color:var(--muted)}#status.error{color:var(--red)}details{margin-top:18px}summary{cursor:pointer;color:var(--muted)}dialog{width:min(1400px,96vw);height:92vh;padding:0;border:1px solid var(--line);border-radius:4px}dialog::backdrop{background:#0009}.zoomhead{display:flex;align-items:center;gap:12px;padding:10px;background:white}.zoomhead input{flex:1;max-width:260px}.zoomview{height:calc(100% - 60px);overflow:auto;background:#e9edeb}.zoomview img{display:block;width:100%;max-width:none;margin:auto}.empty{padding:30px;color:var(--muted)}@media(max-width:1100px){.images{grid-template-columns:1fr 1fr}.images figure:last-child{grid-column:1/-1}.images figure:last-child img{height:480px}}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#queue{grid-template-columns:repeat(3,minmax(0,1fr))}#queue button{font-size:11px;padding:5px}.qstate{float:none;margin-left:4px}.images{grid-template-columns:1fr}.images figure:last-child{grid-column:auto}figure img,.images figure:last-child img{height:350px}.formgrid{grid-template-columns:1fr}main{padding:12px}header{padding:10px}#progress{margin-left:0}.evidence{min-width:180px}dialog{width:98vw}}
</style>
</head>
<body>
<header><h1>DTA · 补图复核</h1><input id="reviewer" aria-label="审核员" placeholder="审核员姓名或ID"><span id="progress">载入中</span><a href="/api/export.csv" download="dog_supplement_reviews.csv">导出CSV</a><a href="/api/export.json" download="dog_supplement_reviews.json">导出JSON</a></header>
<div class="shell"><aside><div class="filters"><button type="button" data-filter="essential" aria-pressed="true">关键18张</button><button type="button" data-filter="random" aria-pressed="false">随机30张</button><button type="button" data-filter="all" aria-pressed="false">全部48张</button></div><div id="queue"></div></aside>
<main><div class="casehead"><div><h2 id="title"></h2><div id="meta" class="meta"></div></div><div class="nav"><button type="button" id="prev" aria-label="上一张">←</button><button type="button" id="next" aria-label="下一张">→</button></div></div>
<div id="flag" class="flag" hidden></div><div id="empty" class="empty" hidden>当前队列为空</div>
<div id="case"><div class="images"><figure><button type="button" data-image="source" aria-label="放大原图"><img id="source" alt="目标原图"></button><figcaption>原图</figcaption></figure><figure><button type="button" data-image="marked" aria-label="放大A框标记图"><img id="marked" alt="A框标记图"></button><figcaption>A框标记图</figcaption></figure><figure><button type="button" data-image="crop" aria-label="放大裁剪图"><img id="crop" alt="放大裁剪图"></button><figcaption>放大裁剪图</figcaption></figure></div>
<div class="formgrid"><label>A框目标匹配<select id="target"><option value="">请选择</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">不确定</option></select></label><label>A框对象类型<select id="kind"><option value="">请选择</option><option value="real_dog">真实犬</option><option value="representation">玩偶 / 雕像 / 图案</option><option value="other">其他对象</option><option value="uncertain">不确定</option></select></label><label>图片处置<select id="decision"><option value="">请选择</option><option value="accept">保留</option><option value="reject">排除 / 替换</option><option value="uncertain">暂缓</option></select></label></div>
<h2>关键特征确认</h2><div class="tablewrap"><table><thead><tr><th>特征</th><th>模型标注</th><th>复核结果</th><th>模型原始证据</th></tr></thead><tbody id="features"></tbody></table></div><div id="noFeatures" class="meta" hidden>该样本只需确认对象类型与图片处置。</div>
<div class="savebar"><textarea id="notes" aria-label="复核备注" placeholder="备注"></textarea><button type="button" id="save" class="primary">保存并下一张</button><span id="status" role="status" aria-live="polite"></span></div>
<details><summary>全部20项模型特征</summary><div class="tablewrap"><table><thead><tr><th>特征</th><th>模型标注</th><th>模型原始证据</th></tr></thead><tbody id="allFeatures"></tbody></table></div></details></div></main></div>
<dialog id="zoom"><div class="zoomhead"><span id="zoomTitle"></span><input type="range" id="scale" min="100" max="500" step="25" value="100" aria-label="图像放大比例"><span id="scaleValue">100%</span><button type="button" id="closeZoom" aria-label="关闭放大图">×</button></div><div class="zoomview"><img id="zoomImage" alt="放大查看"></div></dialog>
<script>
(() => {
const $=id=>document.getElementById(id), S={data:null,filter:'essential',id:null,dirty:false};
const names={coat_primary_color:'毛发主颜色',coat_pattern:'毛发图案',coat_length:'毛发长度',coat_texture:'毛发质地',white_marking_presence:'白色斑纹',head_visibility:'头部可见性',ear_shape:'耳朵形状',ear_position:'耳朵朝向',muzzle_visibility:'口鼻可见性',eye_visibility:'眼睛可见性',tail_visibility:'尾巴可见性',tail_position:'尾巴位置',leg_visibility:'腿部可见性',body_shape:'体型',orientation:'身体朝向',pose:'身体姿势',action_state:'动作状态',occlusion_level:'其他物体遮挡',truncation_level:'画面边界截断',outline_visibility:'轮廓可见性'};
const values={black:'黑色',white:'白色',brown:'棕色',gray:'灰色',tan:'黄褐色',golden:'金色',cream:'奶油色',red:'红色',mixed:'混合',other:'其他',unknown:'无法判断',solid:'纯色',bicolor:'双色',tricolor:'三色',spotted:'斑点',striped:'条纹',patchy:'块状',short:'短',medium:'中',long:'长',hairless_or_not_visible:'无毛 / 毛发不可见',smooth:'平滑',wavy:'波浪',curly:'卷曲',wiry:'硬毛',fluffy:'蓬松',none:'无',small:'少量',moderate:'中等',large:'大量',clear:'清晰可见',partial:'部分',not_visible:'不可见',upright:'直立',floppy:'下垂',semi_upright:'半立',folded:'折叠',forward:'向前',sideways:'向侧',backward:'向后',both:'双眼',one:'一只',up:'向上',down:'向下',curved:'弯曲',extended:'伸直',four_or_more:'四条或更多',two_or_three:'两至三条',slender:'纤细',average:'一般',stocky:'敦实',puppy_like:'幼犬样体型',front:'正面',back:'背面',left_side:'左侧',right_side:'右侧',three_quarter:'斜侧',standing:'站立',sitting:'坐姿',lying:'躺卧',walking:'行走',running:'跑动',jumping:'跳跃',stationary:'静止',playing:'玩耍',eating:'进食',drinking:'饮水',interacting:'互动',heavy:'严重',unclear:'不清晰'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(f,v)=>f==='leg_visibility'&&v==='one'?'仅一条腿':f==='eye_visibility'&&v==='none'?'眼睛不可见':values[v]||v;
const current=()=>S.data.cases.find(c=>c.image_id===S.id);
const filtered=()=>S.data.cases.filter(c=>S.filter==='all'||(S.filter==='essential'?c.group!=='random':c.group==='random'));
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function queue(){const cases=filtered();$('queue').innerHTML=cases.map(c=>`<button type="button" data-id="${c.image_id}" class="${c.image_id===S.id?'active':''}">${c.image_id}<span class="qstate">${c.review?'✓':''}</span></button>`).join('');$('progress').textContent=`关键 ${S.data.cases.filter(c=>c.group!=='random'&&c.review).length}/18 · 全部 ${S.data.cases.filter(c=>c.review).length}/48`;$('prev').disabled=cases.findIndex(c=>c.image_id===S.id)<=0;$('next').disabled=cases.findIndex(c=>c.image_id===S.id)>=cases.length-1}
function render(){const c=current();queue();$('empty').hidden=!!c;$('case').hidden=!c;if(!c)return;$('title').textContent=c.image_id;$('meta').textContent=({baseline:'基线异常目标',critical:'关键稀疏状态',random:'随机质量抽查'}[c.group])+(c.review?' · 已保存':' · 待复核');$('flag').hidden=!c.quality_flag;$('flag').textContent=c.quality_flag?'此前检查标记：非真实犬表现形式，请确认。':'';for(const k of ['source','marked','crop']){$(k).src=c.images[k];$(k).onerror=()=>status('图片载入失败：'+k,true)}const f=c.feature.features,e=c.feature.evidence;const keys=[...new Set(c.gap_states.map(s=>s.split('=')[0]))];$('features').innerHTML=keys.map(k=>{const d=S.data.definitions.find(d=>d.feature_id===k);return `<tr><td>${esc(names[k])}<br><small>${esc(k)}</small></td><td>${esc(val(k,f[k]))}</td><td><select data-feature="${k}" aria-label="${esc(names[k])}复核值"><option value="">请选择</option>${d.possible_values.map(v=>`<option value="${esc(v)}">${esc(val(k,v))}</option>`).join('')}</select></td><td class="evidence">${esc(e[k])}</td></tr>`}).join('');$('noFeatures').hidden=keys.length>0;$('allFeatures').innerHTML=S.data.definitions.map(d=>`<tr><td>${esc(names[d.feature_id])}</td><td>${esc(val(d.feature_id,f[d.feature_id]))}</td><td class="evidence">${esc(e[d.feature_id])}</td></tr>`).join('');const r=c.review||{};$('target').value=r.target_match||'';$('kind').value=r.target_kind||'';$('decision').value=r.decision||'';$('notes').value=r.notes||'';document.querySelectorAll('[data-feature]').forEach(x=>x.value=r.human_features?.[x.dataset.feature]||'');S.dirty=false;status('')}
function navigate(id){if(S.dirty&&!confirm('尚未保存，是否放弃本张修改？'))return;S.id=id;render()}
function move(n){const cases=filtered(),i=cases.findIndex(c=>c.image_id===S.id);if(cases[i+n])navigate(cases[i+n].image_id)}
$('queue').onclick=e=>{const b=e.target.closest('[data-id]');if(b)navigate(b.dataset.id)};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{if(S.dirty&&!confirm('尚未保存，是否放弃本张修改？'))return;S.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));S.id=filtered().find(c=>!c.review)?.image_id||filtered()[0]?.image_id;render()});
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('case').oninput=()=>S.dirty=true;
$('save').onclick=async()=>{const c=current();const human_features={};document.querySelectorAll('[data-feature]').forEach(x=>human_features[x.dataset.feature]=x.value);const body={image_id:c.image_id,reviewer:$('reviewer').value.trim(),target_match:$('target').value,target_kind:$('kind').value,decision:$('decision').value,human_features,notes:$('notes').value.trim()};$('save').disabled=true;try{const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json();if(!res.ok)throw Error(data.error);c.review=data.review;localStorage.setItem('dogSupplementReviewer',body.reviewer);S.dirty=false;const cases=filtered(),i=cases.findIndex(x=>x.image_id===S.id);const next=cases.slice(i+1).find(x=>!x.review);if(next)S.id=next.image_id;render();status('已保存到实验目录')}catch(e){status(e.message,true)}finally{$('save').disabled=false}};
document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{$('zoomImage').src=current().images[b.dataset.image];$('zoomTitle').textContent=({source:'原图',marked:'A框标记图',crop:'放大裁剪图'}[b.dataset.image]);$('scale').value=100;$('zoomImage').style.width='100%';$('scaleValue').textContent='100%';$('zoom').showModal()});
$('scale').oninput=()=>{$('zoomImage').style.width=$('scale').value+'%';$('scaleValue').textContent=$('scale').value+'%'};$('closeZoom').onclick=()=>$('zoom').close();window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
$('reviewer').value=localStorage.getItem('dogSupplementReviewer')||'';
fetch('/api/data').then(r=>{if(!r.ok)throw Error('复核数据加载失败');return r.json()}).then(data=>{S.data=data;S.id=filtered().find(c=>!c.review)?.image_id||filtered()[0]?.image_id;render()}).catch(e=>{$('progress').textContent='载入失败';status(e.message,true)});
})();
</script>
</body></html>
