<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DTA 类别分歧复核</title>
  <style>
    :root { color-scheme: light; --ink:#17201c; --muted:#647068; --line:#d9dfdb; --paper:#f6f7f5; --white:#fff; --local:#087f5b; --online:#275dad; --warn:#b85000; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:0; }
    button,input,select,textarea { font:inherit; letter-spacing:0; }
    button { cursor:pointer; }
    header { height:64px; display:flex; align-items:center; gap:20px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--white); position:sticky; top:0; z-index:10; }
    h1 { margin:0; font-size:18px; white-space:nowrap; }
    .progress { display:flex; align-items:center; gap:10px; min-width:180px; flex:1; max-width:520px; }
    .track { height:7px; flex:1; background:#e5e9e6; overflow:hidden; }
    .fill { height:100%; background:var(--local); width:0; transition:width .2s; }
    .header-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .icon-btn { width:36px; height:36px; border:1px solid var(--line); background:white; display:grid; place-items:center; font-size:19px; }
    main { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(360px,.7fr); min-height:calc(100vh - 64px); }
    .visual { padding:20px; border-right:1px solid var(--line); min-width:0; }
    .case-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:12px; }
    .case-title { font-size:20px; font-weight:700; }
    .source { color:var(--muted); }
    .viewer { background:#202522; min-height:420px; display:grid; place-items:center; position:relative; }
    canvas { display:block; max-width:100%; max-height:62vh; }
    .legend { display:flex; gap:18px; padding:10px 0 16px; color:var(--muted); }
    .dot { width:10px; height:10px; display:inline-block; margin-right:6px; }
    .local-dot { background:var(--local); } .online-dot { background:var(--online); }
    .overlay-wrap { display:grid; grid-template-columns:160px 1fr; gap:14px; align-items:start; border-top:1px solid var(--line); padding-top:16px; }
    .overlay-wrap img { width:160px; max-height:130px; object-fit:contain; background:#202522; }
    .muted { color:var(--muted); }
    aside { padding:20px; min-width:0; background:var(--white); }
    .reviewer-row { display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:16px; }
    input,select,textarea { width:100%; border:1px solid #bfc8c2; background:white; padding:9px 10px; border-radius:3px; }
    input:focus,select:focus,textarea:focus { outline:2px solid #9cc8b8; outline-offset:1px; }
    .candidates { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .candidate { text-align:left; border:1px solid var(--line); border-top:4px solid var(--line); background:#fafbfa; padding:12px; border-radius:4px; min-height:142px; }
    .candidate.local { border-top-color:var(--local); } .candidate.online { border-top-color:var(--online); }
    .candidate.selected { box-shadow:0 0 0 2px var(--ink); }
    .candidate strong { display:block; font-size:16px; margin-bottom:3px; }
    .candidate small { display:block; color:var(--muted); margin-top:6px; }
    .candidate p { margin:7px 0 0; font-size:12px; color:#465049; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .choice-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:18px; }
    .choice { border:1px solid var(--line); background:white; padding:9px 5px; }
    .choice.active { background:var(--ink); color:white; border-color:var(--ink); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; color:#4d5951; font-size:12px; }
    label span { display:block; margin-bottom:4px; }
    .span-2 { grid-column:1 / -1; }
    .binary { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
    .binary button { border:1px solid var(--line); background:white; padding:8px 4px; }
    .binary button.active { background:#dcebe5; border-color:var(--local); color:#075f45; }
    textarea { resize:vertical; min-height:68px; }
    .footer { display:flex; align-items:center; gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
    .primary { margin-left:auto; border:0; background:var(--local); color:white; padding:10px 18px; border-radius:3px; font-weight:650; }
    .primary:disabled { opacity:.45; cursor:not-allowed; }
    .status { min-height:20px; color:var(--muted); }
    .done { color:var(--local); font-weight:650; }
    @media (max-width:900px) { header { padding:0 12px; gap:10px; } main { grid-template-columns:1fr; } .visual { border-right:0; border-bottom:1px solid var(--line); } .viewer { min-height:300px; } canvas { max-height:52vh; } aside { padding:16px; } }
    @media (max-width:560px) { h1 { font-size:15px; } .progress { min-width:100px; } .progress .muted { display:none; } .visual { padding:12px; } .candidates,.form-grid { grid-template-columns:1fr; } .span-2 { grid-column:auto; } .overlay-wrap { grid-template-columns:100px 1fr; } .overlay-wrap img { width:100px; } }
  </style>
</head>
<body>
  <header>
    <h1>DTA 类别分歧复核</h1>
    <div class="progress"><div class="track"><div class="fill" id="fill"></div></div><span id="progress">0 / 0</span><span class="muted" id="position"></span></div>
    <div class="header-actions"><button class="icon-btn" id="prev" title="上一张" aria-label="上一张">&#8592;</button><button class="icon-btn" id="next" title="下一张" aria-label="下一张">&#8594;</button></div>
  </header>
  <main>
    <section class="visual">
      <div class="case-head"><div><div class="case-title" id="imageId"></div><div class="source" id="source"></div></div><div class="done" id="done"></div></div>
      <div class="viewer"><canvas id="canvas"></canvas></div>
      <div class="legend"><span><i class="dot local-dot"></i>本地框</span><span><i class="dot online-dot"></i>在线框</span></div>
      <div class="overlay-wrap"><img id="overlay" alt="SAM 掩码"><div><strong>SAM 分割结果</strong><div class="muted" id="samMeta"></div></div></div>
    </section>
    <aside>
      <div class="reviewer-row"><input id="reviewer" placeholder="复核人" autocomplete="name"><span class="status" id="status"></span></div>
      <div class="candidates">
        <button class="candidate local" id="localCard" type="button"></button>
        <button class="candidate online" id="onlineCard" type="button"></button>
      </div>
      <div class="choice-row"><button class="choice" data-choice="local">本地正确</button><button class="choice" data-choice="online">在线正确</button><button class="choice" data-choice="custom">两者都错</button></div>
      <div class="form-grid">
        <label><span>人工类别</span><select id="classId"></select></label>
        <label><span>主体角色</span><select id="role"></select></label>
        <label><span>轮廓可见性</span><select id="outline"></select></label>
        <label><span>遮挡程度</span><select id="occlusion"></select></label>
        <label class="span-2"><span>SAM 是否分割了所选主体</span><div class="binary" data-field="sam_target_match"><button data-value="yes">是</button><button data-value="no">否</button><button data-value="unknown">不确定</button></div></label>
        <label class="span-2"><span>SAM 掩码质量是否可接受</span><div class="binary" data-field="sam_mask_acceptable"><button data-value="yes">是</button><button data-value="no">否</button><button data-value="unknown">不确定</button></div></label>
        <label class="span-2"><span>备注</span><textarea id="notes" placeholder="记录类别边界、主体选择或异常"></textarea></label>
      </div>
      <div class="footer"><button class="icon-btn" id="back" title="上一张" aria-label="上一张">&#8592;</button><span class="status" id="validation"></span><button class="primary" id="save">保存并下一张</button></div>
    </aside>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const state = { data:null, index:0, choice:null, sam_target_match:'', sam_mask_acceptable:'' };
    const fields = { human_class_id:'classId', human_subject_role:'role', human_outline_visibility:'outline', human_occlusion_level:'occlusion' };

    function option(select, value, label) { const o=document.createElement('option'); o.value=value; o.textContent=label; select.appendChild(o); }
    function candidateHtml(label, value) {
      return `<span>${label}</span><strong>${value.class_id}. ${value.class_name}</strong><div>${value.fine_name}</div><small>${value.subject_role}</small><p>${value.subject_selection_evidence}</p>`;
    }
    function setChoice(choice) {
      state.choice=choice;
      document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.choice===choice));
      $('localCard').classList.toggle('selected',choice==='local'); $('onlineCard').classList.toggle('selected',choice==='online');
      if (choice==='local'||choice==='online') {
        const value=current()[choice];
        $('classId').value=String(value.class_id); $('role').value=value.subject_role;
        $('outline').value=value.outline_visibility; $('occlusion').value=value.occlusion_level;
      }
    }
    function setBinary(field,value) {
      state[field]=value;
      document.querySelectorAll(`[data-field="${field}"] button`).forEach(b=>b.classList.toggle('active',b.dataset.value===value));
    }
    function current(){ return state.data.cases[state.index]; }
    function draw() {
      const item=current(), img=new Image();
      img.onload=()=>{
        const canvas=$('canvas'), maxW=canvas.parentElement.clientWidth, maxH=Math.max(300,innerHeight*.58);
        const scale=Math.min(maxW/img.width,maxH/img.height,1.5);
        canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
        [[item.local,'#19a974'],[item.online,'#4c8ee8']].forEach(([v,color])=>{
          const b=v.target_bbox_hint; ctx.strokeStyle=color; ctx.lineWidth=Math.max(3,canvas.width/220);
          ctx.strokeRect(b[0]*canvas.width,b[1]*canvas.height,(b[2]-b[0])*canvas.width,(b[3]-b[1])*canvas.height);
        });
      }; img.src=item.image_url;
    }
    function restoreReview(review) {
      Object.entries(fields).forEach(([key,id])=>$ (id).value=review[key]||'');
      $('notes').value=review.notes||''; setBinary('sam_target_match',review.sam_target_match||''); setBinary('sam_mask_acceptable',review.sam_mask_acceptable||'');
      const l=current().local,o=current().online;
      const matches=v=>String(v.class_id)==review.human_class_id&&v.subject_role==review.human_subject_role&&v.outline_visibility==review.human_outline_visibility&&v.occlusion_level==review.human_occlusion_level;
      setChoice(review.human_class_id ? (matches(l)?'local':matches(o)?'online':'custom') : null);
    }
    function render(){
      const item=current(), completed=state.data.cases.filter(c=>c.review.human_class_id).length;
      $('imageId').textContent=item.image_id; $('source').textContent=`Imagenette 来源类别：${item.source_class_name}`;
      $('position').textContent=`第 ${state.index+1} 张`; $('progress').textContent=`${completed} / ${state.data.total}`; $('fill').style.width=`${completed/state.data.total*100}%`;
      $('done').textContent=item.review.human_class_id?'已复核':''; $('localCard').innerHTML=candidateHtml('本地 Qwen',item.local); $('onlineCard').innerHTML=candidateHtml('在线模型',item.online);
      $('overlay').src=item.overlay_url; $('samMeta').textContent=`本地提示框生成的掩码；本地 ${Math.round(item.local.class_confidence*100)}% / 在线 ${Math.round(item.online.class_confidence*100)}% 类别置信度`;
      restoreReview(item.review); $('status').textContent=''; $('validation').textContent=''; draw();
    }
    function move(step){ state.index=(state.index+step+state.data.total)%state.data.total; render(); }
    async function save(){
      const reviewer=$('reviewer').value.trim(); localStorage.setItem('dtaReviewer',reviewer);
      const review={ reviewer, notes:$('notes').value.trim(), sam_target_match:state.sam_target_match, sam_mask_acceptable:state.sam_mask_acceptable };
      Object.entries(fields).forEach(([key,id])=>review[key]=$(id).value);
      if(!reviewer||!state.choice||Object.values(review).some((v,i)=>i!==1&&!v)){ $('validation').textContent='请完成全部判断'; return; }
      $('save').disabled=true; $('status').textContent='保存中';
      try { const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_id:current().image_id,review})}); const body=await res.json(); if(!res.ok) throw new Error(body.error); current().review=body.review; $('status').textContent='已保存'; move(1); }
      catch(err){ $('validation').textContent=`保存失败：${err.message}`; }
      finally{$('save').disabled=false;}
    }
    async function init(){
      state.data=await fetch('/api/data').then(r=>r.json());
      Object.entries(state.data.classes).forEach(([id,name])=>option($('classId'),id,`${id}. ${name}`));
      state.data.subject_roles.forEach(v=>option($('role'),v,v)); state.data.outlines.forEach(v=>option($('outline'),v,v)); state.data.occlusions.forEach(v=>option($('occlusion'),v,v));
      $('reviewer').value=localStorage.getItem('dtaReviewer')||'';
      document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setChoice(b.dataset.choice));
      document.querySelectorAll('.binary button').forEach(b=>b.onclick=e=>{e.preventDefault();setBinary(b.parentElement.dataset.field,b.dataset.value)});
      $('localCard').onclick=()=>setChoice('local'); $('onlineCard').onclick=()=>setChoice('online'); $('prev').onclick=$('back').onclick=()=>move(-1); $('next').onclick=()=>move(1); $('save').onclick=save;
      if(state.data.total) render();
    }
    addEventListener('resize',()=>state.data&&state.data.total&&draw()); init().catch(e=>$('status').textContent=e.message);
  </script>
</body>
</html>
